<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%">
  <defs>
    <!-- Radiant Metallic Gold -->
    <linearGradient id="vicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="25%" stop-color="#FFD54F"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="75%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#C44800"/>
    </linearGradient>

    <!-- Hot Specular White/Yellow -->
    <linearGradient id="vicGlint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>

    <!-- Deep Warm Ruby Base -->
    <linearGradient id="rubyBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#7F0000"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="vicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#vicGlow)">
    <!-- Golden Laurel Branches (Left & Right) -->
    <!-- Left Laurel Wreath -->
    <g fill="url(#vicGold)" stroke="#9C4400" stroke-width="1.5">
      <path d="M 65 190 C 45 150 45 95 85 55 C 80 75 90 95 105 105 C 85 85 80 50 115 35 C 110 60 125 75 135 85 C 120 60 135 30 155 35 C 145 60 150 80 155 95" fill="none" stroke="url(#vicGold)" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="60" cy="140" rx="14" ry="7" transform="rotate(-40 60 140)"/>
      <ellipse cx="65" cy="100" rx="15" ry="7" transform="rotate(-25 65 100)"/>
      <ellipse cx="85" cy="65" rx="15" ry="7" transform="rotate(-5 85 65)"/>
      <ellipse cx="115" cy="45" rx="14" ry="7" transform="rotate(20 115 45)"/>
      <ellipse cx="145" cy="38" rx="12" ry="6" transform="rotate(40 145 38)"/>
    </g>

    <!-- Right Laurel Wreath -->
    <g fill="url(#vicGold)" stroke="#9C4400" stroke-width="1.5">
      <path d="M 275 190 C 295 150 295 95 255 55 C 260 75 250 95 235 105 C 255 85 260 50 225 35 C 230 60 215 75 205 85 C 220 60 205 30 185 35 C 195 60 190 80 185 95" fill="none" stroke="url(#vicGold)" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="280" cy="140" rx="14" ry="7" transform="rotate(40 280 140)"/>
      <ellipse cx="275" cy="100" rx="15" ry="7" transform="rotate(25 275 100)"/>
      <ellipse cx="255" cy="65" rx="15" ry="7" transform="rotate(5 255 65)"/>
      <ellipse cx="225" cy="45" rx="14" ry="7" transform="rotate(-20 225 45)"/>
      <ellipse cx="195" cy="38" rx="12" ry="6" transform="rotate(-40 195 38)"/>
    </g>

    <!-- Royal Pedestal Base -->
    <path d="M 125 210 L 215 210 L 225 235 L 115 235 Z" fill="url(#rubyBase)" stroke="url(#vicGold)" stroke-width="3"/>
    <rect x="110" y="235" width="120" height="12" rx="4" fill="url(#vicGold)" stroke="#8A3D00" stroke-width="2"/>

    <!-- Trophy Stem -->
    <path d="M 155 170 L 185 170 L 175 210 L 165 210 Z" fill="url(#vicGold)" stroke="#8A3D00" stroke-width="2.5"/>

    <!-- Trophy Cup Handles -->
    <path d="M 115 105 C 75 105 75 160 120 160" fill="none" stroke="url(#vicGold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 225 105 C 265 105 265 160 220 160" fill="none" stroke="url(#vicGold)" stroke-width="8" stroke-linecap="round"/>

    <!-- Trophy Cup Body -->
    <path d="M 115 80 C 115 155 145 175 170 175 C 195 175 225 155 225 80 Z" fill="url(#vicGold)" stroke="#8A3D00" stroke-width="4"/>

    <!-- Cup Lip -->
    <ellipse cx="170" cy="80" rx="55" ry="12" fill="url(#vicGlint)" stroke="#8A3D00" stroke-width="3"/>
    <ellipse cx="170" cy="82" rx="46" ry="8" fill="#FF8F00"/>

    <!-- Embossed Star on Trophy -->
    <polygon points="170,105 176,120 192,120 179,130 184,145 170,136 156,145 161,130 148,120 164,120" fill="url(#vicGlint)" stroke="#7A3300" stroke-width="1.5"/>

    <!-- Specular Highlight Curve on Cup -->
    <path d="M 132 95 C 132 135 148 155 160 160" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
