<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <!-- Dark Crimson Defeat Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#801026"/>
      <stop offset="50%" stop-color="#4A0515"/>
      <stop offset="100%" stop-color="#240209"/>
    </linearGradient>

    <!-- Metallic Gold Rim Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#FFB300"/>
      <stop offset="70%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#8D3600"/>
    </linearGradient>

    <!-- Cracked Ice/Crystal Glow -->
    <linearGradient id="crackGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF"/>
      <stop offset="50%" stop-color="#0091EA"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="crestdrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#crestdrop)">
    <!-- Drooping Defeat Wings (Left & Right) -->
    <!-- Left Wing -->
    <path d="M 60 110 C 30 130 20 170 35 200 C 45 180 60 170 80 165 C 55 180 50 205 65 220 C 75 195 95 180 115 170 C 85 140 75 125 60 110 Z" fill="#61121C" stroke="#A82B3B" stroke-width="3" opacity="0.9"/>
    <!-- Right Wing -->
    <path d="M 260 110 C 290 130 300 170 285 200 C 275 180 260 170 240 165 C 265 180 270 205 255 220 C 245 195 225 180 205 170 C 235 140 245 125 260 110 Z" fill="#61121C" stroke="#A82B3B" stroke-width="3" opacity="0.9"/>

    <!-- Central Royal Shield -->
    <path d="M 160 30 C 220 30 245 60 245 110 C 245 170 195 210 160 225 C 125 210 75 170 75 110 C 75 60 100 30 160 30 Z" fill="url(#shieldGrad)" stroke="url(#goldBorder)" stroke-width="6"/>

    <!-- Inner Shield Inset -->
    <path d="M 160 42 C 210 42 232 68 232 110 C 232 160 190 196 160 210 C 130 196 88 160 88 110 C 88 68 110 42 160 42 Z" fill="none" stroke="#FFA726" stroke-width="2" opacity="0.6"/>

    <!-- Defeated Cute Puzzle Block Character Inside Shield -->
    <g transform="translate(115, 65)">
      <!-- Block Body with 3D Bevel -->
      <rect x="0" y="0" width="90" height="90" rx="20" fill="#E53935" stroke="#FFCDD2" stroke-width="3"/>
      <rect x="4" y="4" width="82" height="40" rx="16" fill="#FFFFFF" opacity="0.2"/>

      <!-- Sad X Eyes -->
      <!-- Left Eye -->
      <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
        <line x1="20" y1="28" x2="34" y2="42"/>
        <line x1="34" y1="28" x2="20" y2="42"/>
      </g>
      <!-- Right Eye -->
      <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
        <line x1="56" y1="28" x2="70" y2="42"/>
        <line x1="70" y1="28" x2="56" y2="42"/>
      </g>

      <!-- Sad Drooping Mouth -->
      <path d="M 33 65 Q 45 52 57 65" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Tear Drops -->
      <path d="M 16 46 C 14 52 14 56 16 59 C 18 61 21 61 22 59 C 24 56 20 48 16 46 Z" fill="#80D8FF"/>
      <path d="M 74 46 C 72 52 72 56 74 59 C 76 61 79 61 80 59 C 82 56 78 48 74 46 Z" fill="#80D8FF"/>
    </g>

    <!-- Dramatic Lightning Break / Fracture across the shield -->
    <path d="M 125 35 L 140 75 L 125 105 L 155 140 L 142 185 L 152 215" fill="none" stroke="url(#crackGlow)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

    <!-- Bottom Crown Accent -->
    <path d="M 140 215 L 160 200 L 180 215 Z" fill="#FFC107" stroke="#8D3600" stroke-width="2"/>
  </g>
</svg>
